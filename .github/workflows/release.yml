name: Release gsd-status

# Versioning contract (see scripts/version.sh):
#   * Cargo.toml on main always holds the version the NEXT release will cut.
#   * A release tags exactly that version — nothing is bumped beforehand.
#   * Only after the release is published does the `bump` job move main on, so
#     no dev build ever carries a version number that a prod build also used.
#   * The `version` input overrides the manifest for one release, which is how
#     you jump the numbering forward (e.g. straight to 0.7.0).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.7.0. Defaults to the version in Cargo.toml.'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Settle the release version, tag it, and publish the tag name for all
  # downstream jobs to reference.
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag name
        id: tag
        env:
          REQUESTED: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # Tag push: the tag is already the decision.
            echo "name=${BRANCH}"     >> "$GITHUB_OUTPUT"
            echo "version=${BRANCH#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${REQUESTED:-$(./scripts/version.sh get)}"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists — pass a different version input"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A custom version has to land on the branch before it is tagged, so
          # the tagged tree and the release agree on what was built.
          ./scripts/version.sh set "$version"
          if ! git diff --quiet -- Cargo.toml Cargo.lock; then
            git add Cargo.toml Cargo.lock
            git commit -m "chore: set release version to ${version}"
            git push origin "HEAD:${BRANCH}"
          fi

          git tag "$tag"
          git push origin "$tag"
          echo "name=$tag"          >> "$GITHUB_OUTPUT"
          echo "version=$version"   >> "$GITHUB_OUTPUT"

  # Build a native binary for each target platform and upload the
  # platform tarball to the GitHub Release.
  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest

    steps:
      # Build the tagged tree, so the binary's --version matches the release.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        id: package
        run: |
          archive="gsd-status-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C "target/${{ matrix.target }}/release" gsd-status
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true

  # After all platform binaries are uploaded, update Formula/gsd-status.rb
  # on main so `brew install esumerfd/gsd-status-ui/gsd-status` works.
  formula:
    name: Update Homebrew formula
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Download release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$TAG" --pattern "gsd-status-${TAG}-*.tar.gz"

      - name: Compute SHA256 checksums
        id: sha
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          arm64=$(sha256sum "gsd-status-${TAG}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          x86=$(sha256sum "gsd-status-${TAG}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          linux=$(sha256sum "gsd-status-${TAG}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          echo "arm64=$arm64" >> "$GITHUB_OUTPUT"
          echo "x86=$x86"     >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"

      - name: Write formula
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA_ARM64: ${{ steps.sha.outputs.arm64 }}
          SHA_X86: ${{ steps.sha.outputs.x86 }}
          SHA_LINUX: ${{ steps.sha.outputs.linux }}
        run: |
          sed \
            -e "s|{{TAG}}|${TAG}|g" \
            -e "s|{{VER}}|${TAG#v}|g" \
            -e "s|{{SHA_ARM64}}|${SHA_ARM64}|g" \
            -e "s|{{SHA_X86}}|${SHA_X86}|g" \
            -e "s|{{SHA_LINUX}}|${SHA_LINUX}|g" \
            Formula/gsd-status.rb.tmpl > Formula/gsd-status.rb

      - name: Commit and push formula
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gsd-status.rb
          git commit -m "chore: update Homebrew formula to ${TAG}"
          git push

  # The release is out — only now does main move on, so the version that just
  # shipped is never also the version a dev build reports.
  bump:
    name: Bump version for next release
    needs: [prepare, build, formula]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Bump the minor version on main
        env:
          RELEASED: ${{ needs.prepare.outputs.version }}
        run: |
          current=$(./scripts/version.sh get)
          if [ "$current" != "$RELEASED" ]; then
            echo "main is at ${current}, not the released ${RELEASED} — leaving it alone"
            exit 0
          fi

          next=$(./scripts/version.sh next "$RELEASED")
          ./scripts/version.sh set "$next"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${next} after v${RELEASED}"
          git push
